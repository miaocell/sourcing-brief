<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选品罗盘 · 本地版</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand-mark" aria-hidden="true">
        <span class="needle"></span>
      </div>
      <div class="title-block">
        <h1>选品罗盘 <span class="sub">Sourcing Compass · 本地版</span></h1>
        <div class="quality-summary" id="qualitySummary">加载中…</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="stat-pill">
        <span class="stat-label">品牌总数</span>
        <span class="stat-value" id="totalBrands">—</span>
      </div>
      <div class="stat-pill">
        <span class="stat-label">条目总数</span>
        <span class="stat-value" id="totalRows">—</span>
      </div>
      <button class="btn btn-ghost" id="backupBtn" title="备份本地状态为 JSON">备份</button>
      <button class="btn btn-ghost" id="restoreBtn" title="从 JSON 恢复本地状态">恢复</button>
      <input type="file" id="restoreInput" accept=".json" hidden>
    </div>
  </header>

  <!-- 池切换 -->
  <nav class="pool-tabs" id="poolTabs" role="tablist"></nav>

  <!-- 工具栏 -->
  <div class="toolbar">
    <input type="search" id="searchInput" class="search" placeholder="搜索品牌 / 型号 / 品类…">
    <select id="catFilter" class="select"><option value="">全部品类</option></select>
    <select id="priorityFilter" class="select"><option value="">全部优先级</option></select>
    <select id="statusFilter" class="select"><option value="">全部状态</option></select>
    <span class="toolbar-hint" id="poolBrandCount"></span>
  </div>

  <!-- 表格 -->
  <div class="table-wrap">
    <table class="grid" id="grid">
      <thead id="gridHead"></thead>
      <tbody id="gridBody"></tbody>
    </table>
    <div class="empty" id="emptyState" hidden>无匹配条目</div>
  </div>

  <footer class="footer">
    <span>数据抓取日期 <b id="dataDate">—</b> · 状态与备注仅存于本机浏览器（file:// 下可能不持久，建议用「备份」导出）</span>
  </footer>
</div>

<!-- 详情弹窗 -->
<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="关闭">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="data/pools.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
